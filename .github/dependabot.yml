# Documentation des options :
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Les mises à jour majeures ne sont dans aucun groupe : elles arrivent
# chacune dans leur propre PR pour pouvoir être testées individuellement.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Toutes les alertes de sécurité dans une seule PR
      securite:
        applies-to: security-updates
        patterns: ["*"]

      dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]

      prod-patch:
        dependency-type: "production"
        update-types: ["patch"]

      prod-mineures:
        dependency-type: "production"
        update-types: ["minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
